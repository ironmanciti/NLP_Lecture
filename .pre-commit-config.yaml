# pre-commit hook 설정
# 설치: pip install pre-commit && pre-commit install
# 수동 실행: pre-commit run --all-files

repos:
  - repo: https://github.com/mwouts/jupytext
    rev: v1.17.3
    hooks:
      # .ipynb 와 .py 둘 중 하나만 수정해 커밋해도 짝을 자동 동기화
      - id: jupytext
        args: [--sync]
        files: \.(ipynb|py)$
